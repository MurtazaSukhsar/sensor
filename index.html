<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rehab Sensor Controller</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#081233,#1b081c);
font-family:Arial;
color:white;
}

.card{
width:90%;
max-width:420px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

.status{
display:inline-block;
padding:10px 25px;
border-radius:30px;
font-weight:bold;
margin-bottom:20px;
background:#ff3d3d33;
border:1px solid #ff4b4b;
color:#ff4b4b;
}

.title{
color:#3da3ff;
font-size:18px;
margin-bottom:20px;
}

.values{
font-size:70px;
font-weight:bold;
}

.labels{
display:flex;
justify-content:space-around;
opacity:0.7;
margin-bottom:20px;
}

.accel{
display:flex;
justify-content:space-around;
margin-top:20px;
}

.footer{
margin-top:25px;
font-size:14px;
opacity:0.6;
}

</style>
</head>

<body>

<div class="card">

<div class="status" id="status">
CONNECTED
</div>

<div class="title">
LIVE ORIENTATION
</div>

<div class="values">
<span id="pitch">0</span>
<span id="roll">0</span>
</div>

<div class="labels">
<span>PITCH</span>
<span>ROLL</span>
</div>

<hr style="opacity:0.2">

<div class="accel">

<div>
<div id="accelx">0</div>
<div>ACCEL X</div>
</div>

<div>
<div id="accely">0</div>
<div>ACCEL Y</div>
</div>

<div>
<div id="accelz">0</div>
<div>ACCEL Z</div>
</div>

</div>

<div class="footer">
Mount this device on your limb.<br>
Use Chrome or Safari for best results.
</div>

</div>

<script>

let socket = new WebSocket("wss://rehab-hub.onrender.com");

let status = document.getElementById("status");

socket.onopen = ()=>{
status.innerText="CONNECTED";
status.style.color="#3cff7b";
status.style.borderColor="#3cff7b";
};

socket.onclose = ()=>{
status.innerText="DISCONNECTED";
};

window.addEventListener("deviceorientation",(e)=>{

let pitch = e.beta || 0;
let roll = e.gamma || 0;

document.getElementById("pitch").innerText =
Math.round(pitch);

document.getElementById("roll").innerText =
Math.round(roll);

socket.send(JSON.stringify({
pitch:pitch,
roll:roll
}));

});

window.addEventListener("devicemotion",(e)=>{

let a = e.accelerationIncludingGravity;

if(!a) return;

document.getElementById("accelx").innerText =
a.x.toFixed(2);

document.getElementById("accely").innerText =
a.y.toFixed(2);

document.getElementById("accelz").innerText =
a.z.toFixed(2);

});

</script>

</body>
</html>
